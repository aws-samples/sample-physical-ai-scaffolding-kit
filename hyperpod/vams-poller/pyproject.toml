[project]
name = "pask-vams-poller"
version = "0.1.0"
description = "Poller that runs VAMS workflow training requests as Slurm jobs on the PASK HyperPod cluster"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest",
    "moto[dynamodb,s3,sqs,stepfunctions]>=5",
    "ruff",
]

[project.scripts]
pask-vams-poller = "pask_vams_poller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pask_vams_poller"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
preview = true
extend-select = [
    "I",
    "E",
    "F",
    "UP",
    "B",
    "PLC0415",  # https://docs.astral.sh/ruff/rules/import-outside-top-level/
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
