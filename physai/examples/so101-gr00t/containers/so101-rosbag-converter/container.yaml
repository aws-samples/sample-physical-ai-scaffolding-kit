name: so101-rosbag-converter
partition: cpu
base_image: public.ecr.aws/docker/library/python:3.12-slim-bookworm
env:
  # lerobot 0.6+ writes LeRobotDataset v3.0 directly (schema break from v2.1).
  # This is the format the SmolVLA / lerobot-train pipeline consumes.
  # See README.md for the v2.1 → v3.0 migration rationale.
  # 0.6.1 is the latest PyPI release; 0.6.2 exists only on main (dev tag).
  LEROBOT_VERSION: "0.6.1"
  # CPU-only build: skip enroot's NVIDIA hook (98-nvidia.sh), which would
  # otherwise fail on nodes without an NVIDIA driver.
  NVIDIA_VISIBLE_DEVICES: void
