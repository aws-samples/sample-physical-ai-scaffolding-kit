name: install-dcv-server
description: Install NICE DCV server with automatic console session on Ubuntu 24.04
schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: InstallDesktopEnvironment
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "Installing Ubuntu Desktop (minimal)..."
              apt-get update -yq
              apt-get install -yq --no-install-recommends \
                ubuntu-desktop-minimal \
                gdm3 \
                mesa-utils \
                xdg-utils

              # Prevent NetworkManager from managing the primary interface.
              # ubuntu-desktop-minimal pulls in NetworkManager, which conflicts
              # with systemd-networkd used by cloud-init on EC2.
              systemctl disable NetworkManager.service || true
              systemctl disable NetworkManager-wait-online.service || true
              systemctl enable systemd-networkd.service
              systemctl enable systemd-networkd-wait-online.service

              # Tell netplan to use networkd as renderer
              mkdir -p /etc/netplan
              cat > /etc/netplan/01-netcfg.yaml <<'NETPLANEOF'
              network:
                version: 2
                renderer: networkd
                ethernets:
                  all-en:
                    match:
                      name: "en*"
                    dhcp4: true
                    dhcp6: true
              NETPLANEOF
              sed -i 's/^              //' /etc/netplan/01-netcfg.yaml
              chmod 600 /etc/netplan/01-netcfg.yaml

              # Configure GDM autologin for ubuntu user
              mkdir -p /etc/gdm3
              cat > /etc/gdm3/custom.conf <<'GDMEOF'
              [daemon]
              AutomaticLoginEnable=true
              AutomaticLogin=ubuntu
              WaylandEnable=false
              [security]
              [xdmcp]
              [chooser]
              [debug]
              GDMEOF
              sed -i 's/^              //' /etc/gdm3/custom.conf

              echo "allowed_users=anybody" > /etc/X11/Xwrapper.config

              # Generate xorg.conf at boot with correct NVIDIA BusID
              cat > /usr/local/bin/generate-xorg-conf.sh <<'XORGGENEOF'
              #!/bin/bash
              BUSID=$(nvidia-smi --query-gpu=pci.bus_id --format=csv,noheader | head -1 | sed 's/00000000://' | awk -F'[:\\.]' '{printf "%d:%d:%d", strtonum("0x"$1), strtonum("0x"$2), $3}')
              if [ -z "$BUSID" ]; then
                exit 1
              fi
              cat > /etc/X11/xorg.conf <<XORGEOF
              Section "ServerLayout"
                  Identifier "Layout0"
                  Screen 0 "Screen0"
              EndSection

              Section "Device"
                  Identifier "Device0"
                  Driver "nvidia"
                  BusID "PCI:${BUSID}"
                  Option "AllowEmptyInitialConfiguration" "true"
                  Option "ConnectedMonitor" "DFP-0"
              EndSection

              Section "Screen"
                  Identifier "Screen0"
                  Device "Device0"
                  DefaultDepth 24
                  SubSection "Display"
                      Depth 24
                      Virtual 3840 2160
                  EndSubSection
              EndSection
              XORGEOF
              sed -i 's/^              //' /etc/X11/xorg.conf
              XORGGENEOF
              sed -i 's/^              //' /usr/local/bin/generate-xorg-conf.sh
              chmod +x /usr/local/bin/generate-xorg-conf.sh

              cat > /etc/systemd/system/generate-xorg-conf.service <<'SVCXORGEOF'
              [Unit]
              Description=Generate xorg.conf with NVIDIA BusID
              After=nvidia-persistenced.service
              Before=gdm.service

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/generate-xorg-conf.sh
              RemainAfterExit=yes

              [Install]
              WantedBy=multi-user.target
              SVCXORGEOF
              sed -i 's/^              //' /etc/systemd/system/generate-xorg-conf.service
              systemctl enable generate-xorg-conf.service

              # Disable screen lock via gsettings for ubuntu user
              mkdir -p /etc/dconf/profile
              cat > /etc/dconf/profile/user <<'DCONFPROFILE'
              user-db:user
              system-db:local
              DCONFPROFILE
              sed -i 's/^              //' /etc/dconf/profile/user
              mkdir -p /etc/dconf/db/local.d
              cat > /etc/dconf/db/local.d/00-disable-lock <<'DCONFEOF'
              [org/gnome/desktop/lockdown]
              disable-lock-screen=true

              [org/gnome/desktop/screensaver]
              lock-enabled=false
              idle-activation-enabled=false

              [org/gnome/desktop/session]
              idle-delay=uint32 0
              DCONFEOF
              dconf update || true

              systemctl set-default graphical.target

      - name: InstallDCV
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "Installing NICE DCV server..."

              # Download DCV packages tarball for Ubuntu 24.04
              DCV_URL="https://d1uj6qtbmh3dt5.cloudfront.net/nice-dcv-ubuntu2404-x86_64.tgz"
              curl -fsSL -o /tmp/nice-dcv.tgz "$DCV_URL"
              tar -xzf /tmp/nice-dcv.tgz -C /tmp/

              # Install DCV packages from extracted directory
              DCV_DIR=$(find /tmp -maxdepth 1 -type d -name "nice-dcv-*-x86_64" | head -1)
              apt-get install -yq \
                "${DCV_DIR}"/nice-dcv-server_*.deb \
                "${DCV_DIR}"/nice-dcv-web-viewer_*.deb \
                "${DCV_DIR}"/nice-dcv-gl_*.deb \
                "${DCV_DIR}"/nice-xdcv_*.deb

              rm -rf /tmp/nice-dcv.tgz "$DCV_DIR"

              # Enable DCV server
              systemctl enable dcvserver

              # Configure automatic console session for ubuntu user
              cat > /etc/dcv/dcv.conf <<'DCVEOF'
              [license]
              [log]
              [session-management]
              virtual-session-xdcv-args=""
              [session-management/defaults]
              [session-management/automatic-console-session]
              owner="ubuntu"
              storage-root="/home/ubuntu"
              [display]
              enable-client-resize=true
              [display/linux]
              gl-displays=[":0.0"]
              [connectivity]
              web-port=8443
              quic-port=8443
              enable-quic-frontend=false
              [security]
              auth-token-verifier="http://127.0.0.1:8445"
              no-tls-strict=true
              os-auto-lock=false
              [clipboard]
              primary-selection-paste=true
              DCVEOF
              sed -i 's/^              //' /etc/dcv/dcv.conf

              # Install auth-token-verifier service
              cat > /usr/local/bin/dcv-token-verifier.py <<'VERIFIEREOF'
              #!/usr/bin/env python3
              import http.server
              import json
              import os
              import time

              TOKEN_DIR = "/var/run/dcv-tokens"
              PORT = 8445


              class TokenHandler(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(length).decode()
                      params = dict(p.split("=", 1) for p in body.split("&") if "=" in p)
                      token = params.get("authenticationToken", "")
                      token_file = os.path.join(TOKEN_DIR, token)
                      if os.path.isfile(token_file):
                          try:
                              with open(token_file) as f:
                                  data = json.load(f)
                              if data.get("expires", 0) > time.time():
                                  user = data["user"]
                                  response = f'<auth result="yes"><username>{user}</username></auth>'
                                  os.remove(token_file)
                              else:
                                  os.remove(token_file)
                                  response = '<auth result="no"/>'
                          except Exception:
                              response = '<auth result="no"/>'
                      else:
                          response = '<auth result="no"/>'
                      self.send_response(200)
                      self.send_header("Content-Type", "text/xml")
                      self.end_headers()
                      self.wfile.write(response.encode())

                  def log_message(self, format, *args):
                      pass


              if __name__ == "__main__":
                  os.makedirs(TOKEN_DIR, mode=0o700, exist_ok=True)
                  server = http.server.HTTPServer(("127.0.0.1", PORT), TokenHandler)
                  server.serve_forever()
              VERIFIEREOF
              chmod +x /usr/local/bin/dcv-token-verifier.py

              cat > /etc/systemd/system/dcv-token-verifier.service <<'SVCEOF'
              [Unit]
              Description=DCV Auth Token Verifier
              After=network.target
              Before=dcvserver.service

              [Service]
              Type=simple
              ExecStart=/usr/local/bin/dcv-token-verifier.py
              Restart=always
              RestartSec=3

              [Install]
              WantedBy=multi-user.target
              SVCEOF
              sed -i 's/^              //' /etc/systemd/system/dcv-token-verifier.service
              systemctl enable dcv-token-verifier.service

              # Create a service to auto-create DCV console session on boot
              cat > /etc/systemd/system/dcv-console-session.service <<'SESSIONEOF'
              [Unit]
              Description=Create DCV Console Session
              After=dcvserver.service
              Requires=dcvserver.service

              [Service]
              Type=oneshot
              ExecStartPre=/bin/sleep 5
              ExecStart=/usr/bin/dcv create-session --owner ubuntu --type console console
              RemainAfterExit=yes

              [Install]
              WantedBy=multi-user.target
              SESSIONEOF
              sed -i 's/^              //' /etc/systemd/system/dcv-console-session.service
              systemctl enable dcv-console-session.service

              echo "DCV server installation complete."
  - name: validate
    steps:
      - name: ValidateDCV
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              dcv version || echo "DCV version check"
              systemctl is-enabled dcvserver
